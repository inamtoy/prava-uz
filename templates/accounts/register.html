{% extends "base.html" %}

    <div class="card p-3 p-md-4">
      <h1 class="h3 mb-3">Ro'yxatdan o'tish</h1>

      <p class="mt-3 mb-0 text-center">Akkauntingiz bormi? <a href="{% url 'login' %}">Kirish</a></p>

  </div>
</div>
{% endblock %}
