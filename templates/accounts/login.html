{% extends "base.html" %}
{% block title %}Kirish — Prava.uz{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-5">
    <div class="card p-3 p-md-4">
      <h1 class="h3 mb-3">Kirish</h1>
      <form method="post" novalidate>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        {% include "partials/form_fields.html" %}
        <button type="submit" class="btn btn-primary btn-lg w-100">Kirish</button>
      </form>
      <p class="mt-3 mb-0 text-center">Hali akkauntingiz yo'qmi? <a href="{% url 'register' %}">Ro'yxatdan o'ting</a></p>
    </div>
  </div>
</div>
{% endblock %}
