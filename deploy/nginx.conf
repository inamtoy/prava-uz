# Prava.uz — nginx (Ubuntu). O'rnatish:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/prava_uz
#   sudo ln -s /etc/nginx/sites-available/prava_uz /etc/nginx/sites-enabled/prava_uz
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d prava.uz -d www.prava.uz   # 443 bloki va HTTP->HTTPS redirectni o'zi qo'shadi
#
# Domen boshqa bo'lsa: server_name va .env dagi ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS ni almashtiring.

upstream prava_uz_app {
    # gunicorn.service yaratadigan unix socket (RuntimeDirectory=prava_uz)
    server unix:/run/prava_uz/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name prava.uz www.prava.uz;

    access_log /var/log/nginx/prava_uz.access.log;
    error_log  /var/log/nginx/prava_uz.error.log;

    # Savol rasmlari admin orqali yuklanadi
    client_max_body_size 5m;

    # Xavfsizlik sarlavhalari (HSTS ni Django beradi: SECURE_HSTS_SECONDS)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # collectstatic natijasi; fayl nomlarida hash bor (ManifestStaticFilesStorage) — uzoq keshlash xavfsiz
    location /static/ {
        alias /srv/prava_uz/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # Yuklangan rasmlar (media/questions/). Skript bajarilmaydi — faqat statik berish.
    location /media/ {
        alias /srv/prava_uz/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        location ~* \.(php|py|pl|sh|cgi|html?)$ { deny all; }
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # settings.SECURE_PROXY_SSL_HEADER shu sarlavhaga tayanadi
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_pass http://prava_uz_app;
    }
}
